name: Haven Mobile

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'arm64 for phones, x86_64 for the PC emulator'
        default: arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tag builds ship 64-bit and 32-bit ARM phones; manual runs build just the chosen arch
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.arch) || (startsWith(github.ref, 'refs/tags/v') && '["arm64","arm"]' || '["arm64"]')) }}
    env:
      VARIANT: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Debug' }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz" | tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Signing key
        if: env.VARIANT == 'Release'
        run: |
          echo "${{ secrets.HAVEN_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/haven-mobile.jks"
          echo "HAVEN_KEYSTORE=$RUNNER_TEMP/haven-mobile.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble$VARIANT -Darch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: haven-mobile-${{ env.VARIANT }}-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/*/*.apk

  # one job publishes every arch, so parallel builds don't race on the same release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: haven-mobile-Release-*
          path: apks
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: apks/**/*.apk
          make_latest: true

      # the app's update check reads info/latest_version_md.json from main (GitHub contents API, base64)
      - name: Update info for the in-app updater
        run: |
          code=$(grep '^launcher_version_code=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r')
          name=$(grep '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r')
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d')
          [ -n "$notes" ] || notes="Haven Mobile $name"
          find apks -name '*.apk' -printf '%f %s\n' > "$RUNNER_TEMP/apks.txt"
          git fetch -q origin main && git checkout -q -B main origin/main
          mkdir -p info
          python3 - "$code" "$name" "$GITHUB_REF_NAME" "$notes" "$RUNNER_TEMP/apks.txt" <<'PY'
          import json, sys, datetime
          code, name, tag, notes, listing = sys.argv[1:]
          ABI = {"arm64-v8a": "arm64", "armeabi-v7a": "arm", "x86_64": "x86_64", "x86": "x86"}
          files = []
          for line in open(listing):
              file, size = line.split()
              arch = next((a for k, a in ABI.items() if file.endswith(f"-{k}.apk")), "all")
              files.append({"file_name": file, "uri": f"https://github.com/AjanKopke/haven-mobile/releases/download/{tag}/{file}", "arch": arch, "size": int(size)})
          files.sort(key=lambda f: f["arch"] != "arm64")
          body = {"language": "tr", "markdown": notes}
          data = {"code": int(code), "version": name, "created_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "files": files, "default_body": body, "bodies": [body, {"language": "en", "markdown": notes}]}
          open("info/latest_version_md.json", "w").write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add info/latest_version_md.json
          git commit -qm "info: $name [skip ci]" && git push -q origin main
